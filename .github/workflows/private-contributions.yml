name: Update Private Contribution Graph

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/generate_contributions.py"
      - ".github/workflows/private-contributions.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GH_PRIVATE_TOKEN: ${{ secrets.GH_PRIVATE_TOKEN }}
        run: |
          python scripts/generate_contributions.py

      - name: Commit generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg

          git diff --cached --quiet || \
            git commit -m "chore: update contribution graph"

          git push
